name: Auto News Publisher

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs: 
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Random Delay
        run: |
          DELAY=$((RANDOM % 300))
          echo "Scheduled run: Waiting for $DELAY seconds to look human..."
          sleep $DELAY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Run AI News Script
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node fetch_news.js
        
      - name: Commit and Push New Articles
        run: |
          git config --global user.name 'News Bot'
          git config --global user.email 'bot@akhbar3.com'
          git add src/content/posts/*
          git commit -m "Auto add new article" || echo "No changes"
          git pull --rebase origin main
          git push
          
      - name: Trigger Cloudflare Build
        run: curl -X POST "${{ secrets.DEPLOY_HOOK }}"
