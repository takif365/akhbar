name: Auto News Publisher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Run AI News Script
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node fetch_news.js
        
      - name: Commit and Push New Articles
        run: |
          git config --global user.name 'NewsBot'
          git config --global user.email 'bot@akhbar3.com'
          git add .
          git commit -m "Auto update news" || echo "No changes to commit"
          git push
          
      - name: Trigger Cloudflare Build
        run: curl -X POST "${{ secrets.DEPLOY_HOOK }}"
